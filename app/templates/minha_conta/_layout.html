{% extends "base.html" %}
{% import "_icones.html" as icone %}
{% block descricao %}Perfil, carteira e lances da sua conta no Leilão TCG.{% endblock %}
{% block conteudo %}
<div class="cabecalho">
  <h1>Minha Conta</h1>
  <p class="cabecalho__texto">{{ cliente.nome }}</p>
</div>

<div class="conta-abas">
  <nav class="conta-abas__nav" aria-label="Seções de Minha Conta">
    <ul class="conta-abas__lista">
      <li><a class="aba" href="{{ url_for('minha_conta.perfil') }}" {% if aba == "perfil" %}aria-current="page"{% endif %}>Perfil</a></li>
      <li><a class="aba" href="{{ url_for('minha_conta.carteira') }}" {% if aba == "carteira" %}aria-current="page"{% endif %}>Carteira</a></li>
      <li><a class="aba" href="{{ url_for('minha_conta.lances') }}" {% if aba == "lances" %}aria-current="page"{% endif %}>Meus lances</a></li>
    </ul>
  </nav>
  <form class="conta-abas__sair" method="post" action="{{ url_for('contas.sair') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="botao botao--terciario" type="submit">{{ icone.sair() }}Sair</button>
  </form>
</div>

<section class="conta-conteudo" aria-labelledby="titulo-secao">
  {% block secao %}{% endblock %}
</section>
{% endblock %}
